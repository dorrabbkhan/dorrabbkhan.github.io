<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <title>DK — Dorrabb Khan</title>
  <defs>
    <!-- site background gradients: dark theme default, light via media query -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#2c2c2e"/>
    </linearGradient>
    <!-- headline accent gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <!-- frosted-glass sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- soft glow behind monogram -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
  </defs>
  <rect width="180" height="180" rx="42" fill="url(#bg)"/>
  <rect width="180" height="180" rx="42" fill="url(#sheen)"/>
  <rect x="3" y="3" width="174" height="174" rx="39" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="90" y="117" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="76" font-weight="700" letter-spacing="-4" fill="url(#accent)" filter="url(#glow)">DK</text>
</svg>
