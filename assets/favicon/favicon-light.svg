<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <title>DK — Dorrabb Khan</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5ebe0"/>
      <stop offset="1" stop-color="#efe4d6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5a3c"/>
      <stop offset="0.5" stop-color="#a67c52"/>
      <stop offset="1" stop-color="#c49a6c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="180" height="180" rx="42" fill="url(#bg)"/>
  <rect width="180" height="180" rx="42" fill="url(#sheen)"/>
  <rect x="3" y="3" width="174" height="174" rx="39" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="90" y="117" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="76" font-weight="700" letter-spacing="-4" fill="url(#accent)" filter="url(#glow)">DK</text>
</svg>
