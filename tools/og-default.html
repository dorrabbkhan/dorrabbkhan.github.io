<!doctype html>
<!-- OG preview image template (1200x630). Render with tools/generate-og-image.sh -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../assets/css/fonts/inter-latin-var.woff2") format("woff2");
        font-weight: 100 900;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #1c1c1e;
        font-family: "Inter", -apple-system, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 80px;
        position: relative;
      }

      /* subtle accent glow, echoing .cursor-gradient-blob */
      .glow {
        position: absolute;
        top: -260px;
        right: -160px;
        width: 700px;
        height: 700px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(100, 181, 246, 0.16) 0%,
          rgba(56, 189, 248, 0.08) 40%,
          transparent 70%
        );
      }

      .name {
        font-size: 108px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.05;
        /* same gradient as .post-headline */
        background: linear-gradient(
          135deg,
          #64b5f6 0%,
          #38bdf8 25%,
          #22d3ee 50%,
          #38bdf8 75%,
          #64b5f6 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        margin-top: 28px;
        font-size: 42px;
        font-weight: 500;
        color: #e5e5e7;
        letter-spacing: -0.01em;
      }

      .url {
        position: absolute;
        bottom: 56px;
        left: 80px;
        font-size: 26px;
        font-weight: 500;
        color: #86868b;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="name">Dorrabb Khan</div>
    <div class="subtitle">Senior DevOps &amp; Cloud Engineer · Munich</div>
    <div class="url">dorrabbkhan.github.io</div>
  </body>
</html>
