---
# layout: compress
---

<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />

    {% seo %} {% include favicon.html %}

    <link
      rel="preload"
      href="{{ '/assets/css/fonts/inter-latin-var.woff2' | relative_url }}"
      as="font"
      type="font/woff2"
      crossorigin
    />
    {% include theme-init.html %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

    <script src="{{ '/assets/js/theme-switcher.js' | relative_url }}"></script>
  </head>

  <body>
    <div class="cursor-gradient">
      <div class="cursor-gradient-blob"></div>
    </div>
    <main>
      <article>{{ content }}</article>
    </main>

    <footer>{% include social-footer.html %}</footer>

    {% include local-time.html %} {% include command-palette.html %} {% include
    analytics.html %}
    <script src="{{ '/assets/js/cursor-gradient.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/command-palette.js' | relative_url }}"></script>
  </body>
</html>
