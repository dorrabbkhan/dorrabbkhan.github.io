title: Dorrabb Khan
description: "Senior DevOps & Cloud Engineer in Munich. Writing about AWS, FinOps, observability and developer experience."
baseurl: ""
url: "https://dorrabbkhan.github.io"
email: dorrabbk@gmail.com
lang: en

author:
  name: Dorrabb Khan
  url: "https://dorrabbkhan.github.io"

social:
  name: Dorrabb Khan
  links:
    - https://www.linkedin.com/in/dorrabbkhan
    - https://github.com/dorrabbkhan

twitter:
  card: summary_large_image

permalink: /blog/:year/:title/

# Social media links in footer
linkedin: "dorrabbkhan"
github: "dorrabbkhan"
instagram: "dorrabbkhan"

# Markdown
highlighter: rouge
markdown: kramdown

# Tracker
goatcounter: "dorrabb"

sass:
  sass_dir: /assets/css/_sass
  style: compressed

# Default front matter: og:image for every page
# (jekyll-seo-tag reads `image` from front matter / defaults)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png

include:
  - _pages

exclude:
  - README.md
  - LICENSE.md
  - tools

# Feed: keep every post so the whole archive can be imported elsewhere
feed:
  posts_limit: 100

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-email-protect
  - jekyll-target-blank
  - jekyll-sitemap
