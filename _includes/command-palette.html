<!-- Command palette (Ctrl/Cmd+K) -->
<button
  id="command-palette-trigger"
  class="command-palette-trigger"
  aria-label="Open command palette (Ctrl K)"
  title="Search (Ctrl K)"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
    width="1em"
    height="1em"
    fill="currentColor"
    aria-hidden="true"
  >
    <path
      d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"
    />
  </svg>
  <span>Search</span>
  <kbd class="command-palette-kbd">Ctrl K</kbd>
</button>

<div id="command-palette" class="command-palette" hidden>
  <div class="command-palette-backdrop"></div>
  <div
    class="command-palette-panel"
    role="dialog"
    aria-modal="true"
    aria-label="Command palette"
  >
    <input
      type="text"
      class="command-palette-input"
      placeholder="Search posts &amp; pages…"
      autocomplete="off"
      spellcheck="false"
    />
    <ul class="command-palette-list" role="listbox"></ul>
    <div class="command-palette-footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>

<script>
  {%- if site.email %}window.__cmdkEmail = "{{ site.email | base64_encode }}";{% endif %}
  window.__cmdkItems = [
    { "title": "Toggle theme", "action": "theme" },
    { "title": "Go to home", "url": "{{ '/' | relative_url }}" },
    { "title": "Go to about", "url": "{{ '/about/' | relative_url }}" },
    { "title": "Go to projects", "url": "{{ '/projects/' | relative_url }}" },
    { "title": "Go to blog", "url": "{{ '/blog' | relative_url }}" },
    { "title": "Random post", "action": "random" },
    { "title": "Copy link to this page", "action": "copy", "confirm": "Link copied" },
    { "title": "Get CV (English)", "url": "{{ '/assets/docs/CV-Muhammad_Dorrabb_Khan_Niazi-EN.pdf' | relative_url }}", "type": "pdf", "newTab": true },
    { "title": "Get CV (German)", "url": "{{ '/assets/docs/CV-Muhammad_Dorrabb_Khan_Niazi-DE.pdf' | relative_url }}", "type": "pdf", "newTab": true },
    {%- if site.email %}
    { "title": "Email me", "action": "email", "type": "contact" },
    {%- endif %}
    {%- if site.linkedin %}
    { "title": "Visit LinkedIn", "url": "https://www.linkedin.com/in/{{ site.linkedin }}", "type": "contact", "newTab": true },
    {%- endif %}
    {%- if site.github %}
    { "title": "Visit GitHub", "url": "https://www.github.com/{{ site.github }}", "type": "contact", "newTab": true },
    {%- endif %}
    {%- if site.instagram %}
    { "title": "Visit Instagram", "url": "https://www.instagram.com/{{ site.instagram }}", "type": "contact", "newTab": true },
    {%- endif %}
    {%- assign nav_pages = site.pages | where_exp: "p", "p.title" -%}
    {%- assign all_items = nav_pages | concat: site.posts -%}
    {%- for item in all_items %}
    { "title": {{ item.title | jsonify }}, "url": {{ item.url | relative_url | jsonify }}, "type": "{% if item.date %}post{% else %}page{% endif %}" },
    {%- endfor %}
  ];
</script>
