<script>
  (function () {
    var theme = null;
    try {
      theme = localStorage.getItem("theme");
    } catch (e) {}
    if (theme !== "dark" && theme !== "light") {
      theme = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }
    document.documentElement.dataset.theme = theme;
  })();
</script>
