{% if jekyll.environment == "production" %}
<!-- Google Analytics Tracking code -->
{% if site.analytics %}
<script
  async
  src="https://www.googletagmanager.com/gtag/js?id={{site.analytics}}"
></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {
    dataLayer.push(arguments);
  }
  gtag("js", new Date());

  gtag("config", "{{site.analytics}}");
</script>
{% endif %}

<!-- GoatCounter: lightweight, privacy-friendly analytics -->
{% if site.goatcounter %}
<script
  data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count"
  async
  src="https://gc.zgo.at/count.js"
></script>
{% endif %} {% endif %}
